name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (no editable shared / no PaddleOCR)
        run: |
          python -m pip install --upgrade pip
          # Strip local editable path and heavy OCR stack for CI unit tests.
          grep -vE '^-e |^paddle' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install -e ./ci/ollama_shared
          pip install pytest

      - name: Run unit tests
        run: |
          pytest tests/ -q --tb=short -m "not live"
        env:
          PYTHONUTF8: "1"
