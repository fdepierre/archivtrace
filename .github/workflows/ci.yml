name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check pipeline connectors strategies utils models.py config.py collecte.py analyse.py synthesize.py tests

      - name: Pyright
        run: python -m pyright --project pyproject.toml

      - name: Run unit tests
        run: python -m pytest tests/ -q --tb=short -m "not live"
        env:
          PYTHONUTF8: "1"
