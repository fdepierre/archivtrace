[project]
name = "archivtrace"
version = "0.1.0"
description = "Citation-first documentary research assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires a running Ollama (or cloud LLM) with models installed",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "pipeline", "connectors", "strategies", "utils", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by formatter / docs
    "B008",  # argparse defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pyright]
include = ["pipeline", "connectors", "strategies", "utils", "models.py", "config.py"]
exclude = ["work", ".venv", "ci", "vendor/ollama_shared"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = ["vendor/ollama_shared"]
